<header class="encabezado">
  <div class="contenedor encabezado-contenido">
    <a routerLink="/tickets" class="marca">
      <span class="marca-icono">🛠️</span>
      <span>Soporte Técnico <small>Gestión de tickets</small></span>
    </a>
    <nav class="navegacion">
      <a routerLink="/tickets" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Tickets</a>
      <a routerLink="/tickets/nuevo" routerLinkActive="activo" class="btn btn-primario">+ Nuevo ticket</a>
    </nav>
  </div>
</header>

<main class="contenedor">
  <router-outlet />
</main>
